<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img
        class="header__picture"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      >
      <a
        class="header__more-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?</a>
    </header>
    <main class="main">
      <section>
        <h2 class="section__heading section__heading_new-task">Add Item</h2>
        <div class="tasks">
          <input id="new-task" class="input tasks__task-field tasks__task-field_new-task" type="text">
          <button id="new-task-button" class="button">Add</button>
        </div>
      </section>

      <section>
        <h1 class="section__heading">Todo</h1>
        <ul id="incomplete-tasks">
          <li class="tasks__task">
            <input type="checkbox" class="checkbox">
            <label class="label tasks__task-field">Pay Bills</label>
            <input type="text" class="input tasks__task-field">
            <button class="button button_edit">Edit</button>
            <button class="button button_delete">
              <img class="button__icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
          <li class="tasks__task tasks__task_edit">
            <input type="checkbox" class="checkbox">
            <label class="label tasks__task-field">Go Shopping</label>
            <input type="text" value="Go Shopping" class="input tasks__task-field">
            <button class="button button_edit">Save</button>
            <button class="button button_delete">
              <img class="button__icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>

      <section>
        <h2 class="section__heading">Completed</h2>
        <ul id="completed-tasks" class="tasks_completed">
          <li class="tasks__task">
            <input type="checkbox" class="checkbox" checked>
            <label class="label tasks__task-field">See the Doctor</label>
            <input type="text" class="input tasks__task-field">
            <button class="button button_edit">Edit</button>
            <button class="button button_delete">
              <img class="button__icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
