<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="eisenhower-matrix">
      <img
        class="eisenhower-matrix-picture"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
      >
      <a
        class="more-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >Want more details?</a>
    </header>
    <main class="main">
      <section>
        <label class="heading" for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task"class="input task" type="text">
          <button id="new-task-button" class="button">Add</button>
        </div>
      </section>

      <section>
        <h1 class="heading">Todo</h1>
        <ul id="incomplete-tasks">
          <li class="task-item">
            <input type="checkbox" class="checkbox">
            <label class="label task">Pay Bills</label>
            <input type="text" class="input task">
            <button class="button edit-button">Edit</button>
            <button class="button delete-button">
              <img class="button-icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
          <li class="task-item edit-mode">
            <input type="checkbox" class="checkbox">
            <label class="label task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="input task">
            <button class="button edit-button">Save</button>
            <button class="button delete-button">
              <img class="button-icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>

      <section>
        <h2 class="heading">Completed</h2>
        <ul id="completed-tasks">
          <li class="task-item">
            <input type="checkbox" class="checkbox" checked>
            <label class="label task">See the Doctor</label>
            <input type="text" class="input task">
            <button class="button edit-button">Edit</button>
            <button class="button delete-button">
              <img class="button-icon" src="./remove.svg" alt="Delete">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
